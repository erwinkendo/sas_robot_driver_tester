services:
  sas_ur_robot_driver_tester_gpio:
    build: 
      context: .
      dockerfile: Dockerfile.tool_gpio
    stop_signal: SIGINT
    stop_grace_period: 1m
    network_mode: "host"
    environment:
      - ROS_DOMAIN_ID
    cap_add:
      - SYS_NICE # PREEMPT_RT
    ulimits:
      rtprio: 99 # PREEMPT_RT
      rttime: -1 # PREEMPT_RT
    tty: true
    stdin_open: true
    command: /bin/bash -c "
      cd /root/ros2_ws/
      && source /opt/ros/jazzy/setup.bash
      && source install/setup.bash
      && export FASTRTPS_DEFAULT_PROFILES_FILE=/root/ros2_ws/src/sas_ur_control_template/docker/scripts/fastrtps_profile.xml
      && ros2 launch sas_ur_control_template robot_example_cpp_launch.py ip:=192.168.0.33 robot_topic_name:=ur_1_sim tool_gpio_enable:=True name:=ur3e"